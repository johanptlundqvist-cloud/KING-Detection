name: Build KING Detection APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'KING_Detection_v1_0_GitHub_klart_for_uppladdning.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and fix JVM compatibility
        shell: bash
        run: |
          set -euo pipefail
          unzip -q KING_Detection_v1_0_GitHub_klart_for_uppladdning.zip -d project
          BUILD_FILE=$(find project -type f -path '*/app/build.gradle.kts' -print -quit)
          test -n "$BUILD_FILE"
          cat >> "$BUILD_FILE" <<'GRADLE'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          GRADLE
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Detection-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
