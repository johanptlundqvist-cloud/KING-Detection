name: Build KING Detection APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'KING_Detection_v1_0_GitHub_klart_for_uppladdning.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q KING_Detection_v1_0_GitHub_klart_for_uppladdning.zip -d project
      - name: Find and build Android app
        run: |
          set -e
          BUILD_FILE=$(find project -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -1)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Detection-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
